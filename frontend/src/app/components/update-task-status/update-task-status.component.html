<div class="page">
  <div class="card">
    <h3>Update Task Status</h3>

    @if (errorMessage()) {
      <div class="alert alert-error">{{ errorMessage() }}</div>
    }

    @if (successMessage()) {
      <div class="alert alert-success">{{ successMessage() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="task-form">
      <div class="form-row">
        <label>Task ID</label>
        <input class="input" formControlName="taskId" />
      </div>

      <div class="form-row">
        <label>Status</label>
        <select class="input" formControlName="status">
          <option value="Todo">Todo</option>
          <option value="InProgress">InProgress</option>
          <option value="Completed">Completed</option>
        </select>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="isLoading()" class="btn-primary">Update</button>
      </div>
    </form>

    @if (isLoading()) {
      <div class="loading">Updating...</div>
    }
  </div>
</div>
