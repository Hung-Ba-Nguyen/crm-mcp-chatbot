<style>
  .create-task-container input,
  .create-task-container textarea,
  .create-task-container select {
    width: 100%;
    padding: 9px 12px;
    border-radius: 8px;
    border: 1.5px solid #cbd5e1;
    font-size: 0.9rem;
    color: #0f172a;
    background: #ffffff;
    box-sizing: border-box;
    outline: none;
    transition: all 0.15s ease-in-out;
  }

  .create-task-container select {
    cursor: pointer;
  }

    .create-task-container input:focus,
    .create-task-container textarea:focus,
    .create-task-container select:focus {
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12) !important;
    }

  .create-task-container .input-error {
    border-color: #ef4444 !important;
    background-color: #fef2f2 !important;
  }

  .create-task-container textarea {
    font-family: inherit;
    resize: vertical;
  }

  /* KHUNG MULTI-SELECT SUPERVISORS HIỆN ĐẠI */
  .supervisors-picker-box {
    border: 1.5px solid #cbd5e1;
    border-radius: 8px;
    padding: 10px 12px;
    background: #f8fafc;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 130px;
    overflow-y: auto;
  }

  .supervisor-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    font-size: 0.82rem;
    font-weight: 500;
    color: #334155;
    cursor: pointer;
    user-select: none;
    transition: all 0.15s ease;

    &:hover {
      border-color: #6366f1;
      color: #6366f1;
    }

    &.selected {
      background: #e0e7ff;
      border-color: #6366f1;
      color: #4338ca;
      font-weight: 600;
    }

    .sup-avatar {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #4f46e5;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
    }
  }
</style>

<div style="min-height: calc(100vh - 75px); display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; background: #f8fafc;">
  <div class="create-task-container" style="width: 100%; max-width: 720px; background: #ffffff; border-radius: 14px; padding: 26px 32px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); border: 1px solid #e2e8f0; box-sizing: border-box;">

    <h2 style="margin: 0 0 18px 0; font-size: 1.35rem; font-weight: 700; color: #0f172a; text-align: center;">
      Tạo Task mới
    </h2>

    <form (ngSubmit)="submit()" #taskNgForm="ngForm" novalidate>
      <!-- Tiêu đề Task -->
      <div class="form-group" style="margin-bottom: 14px;">
        <label style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #334155;">
          Tiêu đề Task <span style="color: #ef4444;">*</span>
        </label>
        <input type="text" name="title" [(ngModel)]="taskForm.title" [class.input-error]="hasFieldError('title')" placeholder="Nhập tiêu đề task...">
      </div>

      <!-- Mô tả chi tiết -->
      <div class="form-group" style="margin-bottom: 14px;">
        <label style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #334155;">
          Mô tả chi tiết
        </label>
        <textarea name="description" [(ngModel)]="taskForm.description" placeholder="Nhập mô tả nhiệm vụ công việc..." rows="2"></textarea>
      </div>

      <!-- Phòng ban & Người phụ trách -->
      <div style="display: flex; gap: 14px; margin-bottom: 14px;">
        <div class="form-group" style="flex: 1;">
          <label style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #334155;">
            Phòng ban phụ trách <span style="color: #ef4444;">*</span>
          </label>
          <select name="departmentId" [(ngModel)]="taskForm.departmentId" [class.input-error]="hasFieldError('departmentId')">
            <option value="" disabled selected>-- Chọn Phòng Ban --</option>
            @for (dept of departments; track dept.id) {
            <option [value]="dept.id">{{ dept.name }}</option>
            }
          </select>
        </div>

        <div class="form-group" style="flex: 1;">
          <label style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #334155;">
            Người phụ trách chính <span style="color: #ef4444;">*</span>
          </label>
          <select name="assigneeId" [(ngModel)]="taskForm.assigneeId" [class.input-error]="hasFieldError('assigneeId')">
            <option value="" disabled selected>-- Chọn Người Phụ Trách --</option>
            @for (user of users; track user.id) {
            <option [value]="user.id">{{ user.name }}</option>
            }
          </select>
        </div>
      </div>

      <!-- Hạn hoàn thành & Độ ưu tiên -->
      <div style="display: flex; gap: 14px; margin-bottom: 14px;">
        <div class="form-group" style="flex: 1;">
          <label style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #334155;">
            Hạn hoàn thành <span style="color: #ef4444;">*</span>
          </label>
          <input type="date" name="dueDate" [(ngModel)]="taskForm.dueDate" [class.input-error]="hasFieldError('dueDate')">
        </div>

        <div class="form-group" style="flex: 1;">
          <label style="display: block; margin-bottom: 4px; font-weight: 600; font-size: 0.85rem; color: #334155;">
            Độ ưu tiên
          </label>
          <select name="priority" [(ngModel)]="taskForm.priority">
            <option value="Low">Thấp</option>
            <option value="Medium">Trung bình</option>
            <option value="High">Cao</option>
          </select>
        </div>
      </div>

      <!-- Người giám sát (Supervisors - Hỗ trợ chọn nhiều) -->
      <div class="form-group" style="margin-bottom: 22px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label style="font-weight: 600; font-size: 0.85rem; color: #334155; margin: 0;">
            Người giám sát (Supervisors)
          </label>
          <span style="font-size: 0.78rem; color: #64748b;">
            Đã chọn: <strong>{{ selectedSupervisorIds.length }}</strong>
          </span>
        </div>

        <div class="supervisors-picker-box">
          @for (user of users; track user.id) {
          <div class="supervisor-chip"
               [class.selected]="isSupervisorSelected(user.id)"
               (click)="toggleSupervisor(user.id)">
            <span class="sup-avatar">{{ user.name.charAt(0) }}</span>
            <span>{{ user.name }}</span>
            @if (isSupervisorSelected(user.id)) {
            <span style="margin-left: 2px;">✓</span>
            }
          </div>
          }
        </div>
      </div>

      <button type="submit" [disabled]="isLoading()" style="background: #4f46e5; color: white; padding: 11px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.95rem; width: 100%; transition: all 0.2s; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);">
        @if (isLoading()) { Đang tạo task... } @else { Tạo Task }
      </button>
    </form>
  </div>
</div>
