<main class="page-wrapper">

  <!-- ═══ LOGIN CARD ═══════════════════════════════════════════════ -->
  <div class="login-card" role="main" aria-label="Đăng nhập">

    <!-- ── Logo ─────────────────────────────────────────────────── -->
    <div class="logo-wrap" aria-label="VietMap CRM-MCP Chatbot">

      <div class="logo-mark" aria-hidden="true">
        <!-- AI / Robot icon (inline SVG) -->
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Head -->
          <rect x="10" y="14" width="28" height="22" rx="6" fill="white" fill-opacity="0.92"/>
          <!-- Eyes -->
          <circle cx="18" cy="23" r="3.5" fill="#6366f1"/>
          <circle cx="30" cy="23" r="3.5" fill="#6366f1"/>
          <!-- Eye shine -->
          <circle cx="19.2" cy="21.8" r="1" fill="white"/>
          <circle cx="31.2" cy="21.8" r="1" fill="white"/>
          <!-- Mouth -->
          <rect x="18" y="30" width="12" height="2.5" rx="1.25" fill="#6366f1"/>
          <!-- Antenna -->
          <line x1="24" y1="14" x2="24" y2="8" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <circle cx="24" cy="7" r="2" fill="white"/>
          <!-- Ears / side sensors -->
          <rect x="6" y="20" width="4" height="8" rx="2" fill="white" fill-opacity="0.7"/>
          <rect x="38" y="20" width="4" height="8" rx="2" fill="white" fill-opacity="0.7"/>
          <!-- Body/neck indicator dots -->
          <circle cx="21" cy="39" r="1.5" fill="white" fill-opacity="0.5"/>
          <circle cx="24" cy="39" r="1.5" fill="white" fill-opacity="0.5"/>
          <circle cx="27" cy="39" r="1.5" fill="white" fill-opacity="0.5"/>
        </svg>
      </div>

      <div class="logo-text-wrap">
        <span class="logo-name">VietMap <span>CRM-MCP</span></span>
        <span class="logo-sub">Chatbot</span>
      </div>
    </div>

    <!-- ── Language Switcher ─────────────────────────────────────── -->
    <div class="lang-switcher" role="group" aria-label="Chọn ngôn ngữ">
      <button
        type="button"
        class="lang-btn"
        [class.active]="activeLang === 'vi'"
        (click)="setLang('vi')"
        aria-label="Tiếng Việt">
        <img src="https://flagcdn.com/w20/vn.png" alt="VN" class="flag-icon"> Tiếng Việt
      </button>
      <button
        type="button"
        class="lang-btn"
        [class.active]="activeLang === 'en'"
        (click)="setLang('en')"
        aria-label="English">
        <img src="https://flagcdn.com/w20/us.png" alt="US" class="flag-icon"> English
      </button>
    </div>

    <!-- ── Form Header ───────────────────────────────────────────── -->
    <header class="form-header">
      <h1 class="form-title">{{ t.welcome }}</h1>
      <p class="form-subtitle">{{ t.subtitle }}</p>
    </header>

    <!-- ── Login Form ────────────────────────────────────────────── -->
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <!-- Username field -->
      <div
        class="input-group"
        [class.has-error]="form.get('username')?.invalid && form.get('username')?.touched">
        <label class="input-label" for="username">{{ t.emailLabel }}</label>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <input
            id="username"
            formControlName="username"
            type="text"
            class="form-input"
            [placeholder]="t.emailPlaceholder"
            autocomplete="username"
            spellcheck="false"
            required
            aria-required="true"/>
        </div>
        <div
          *ngIf="form.get('username')?.invalid && form.get('username')?.touched"
          class="field-error"
          role="alert"
          aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="16" x2="12.01" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Please enter your username or email address.</span>
        </div>
      </div>

      <!-- Password field -->
      <div
        class="input-group input-with-icon-right"
        [class.has-error]="form.get('password')?.invalid && form.get('password')?.touched">
        <label class="input-label" for="password">{{ t.passLabel }}</label>
        <div class="input-wrapper">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <input
            id="password"
            formControlName="password"
            [type]="showPassword() ? 'text' : 'password'"
            class="form-input"
            [placeholder]="t.passPlaceholder"
            autocomplete="current-password"
            required
            aria-required="true"/>
          <button
            type="button"
            class="password-toggle"
            aria-label="Toggle password visibility"
            [attr.aria-pressed]="showPassword()"
            (click)="togglePassword()">
            <svg *ngIf="!showPassword()" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg *ngIf="showPassword()" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div
          *ngIf="form.get('password')?.invalid && form.get('password')?.touched"
          class="field-error"
          role="alert"
          aria-live="polite">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="16" x2="12.01" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>Please enter your password.</span>
        </div>
      </div>

      <!-- Options row -->
      <div class="form-options">
        <label class="checkbox-wrap" for="remember-me">
          <span class="custom-checkbox">
            <input type="checkbox" id="remember-me" formControlName="remember"/>
            <span class="checkbox-box" aria-hidden="true"></span>
          </span>
          <span class="checkbox-label">{{ t.remember }}</span>
        </label>
        <a href="#" class="forgot-link" (click)="$event.preventDefault()">{{ t.forgot }}</a>
      </div>

      <!-- Server error -->
      <div
        class="error-message"
        [class.visible]="serverError()"
        role="alert"
        aria-live="assertive"
        aria-atomic="true">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
          <line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="16" x2="12.01" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>{{ serverError() }}</span>
      </div>

      <!-- Submit button -->
      <button
        type="submit"
        id="btn-signin"
        class="btn-signin"
        [class.loading]="loading()"
        [disabled]="loading()">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label">{{ t.signIn }}</span>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

    </form>

    <!-- Sign up row -->
    <p class="signup-row">
      {{ t.noAccount }}
      <a href="#" (click)="$event.preventDefault()">{{ t.request }}</a>
    </p>
