<mat-sidenav-container class="task-shell">
  <mat-sidenav mode="side" opened class="task-sidenav">
    <div class="sidenav-header">
      <h2>Task List</h2>
      <p>Select a task to discuss</p>
    </div>

    <mat-nav-list>
      <a
        mat-list-item
        *ngFor="let task of mockTasks"
        (click)="selectTask(task)"
        [class.active]="selectedTask.id === task.id"
      >
        <span matListItemTitle>{{ task.title }}</span>
        <span matListItemLine>{{ task.status }}</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <div class="chat-panel">
      <div class="chat-header">
        <h3>{{ selectedTask.title }}</h3>
        <p>Status: {{ selectedTask.status }}</p>
      </div>

      <div class="messages-list">
        <div
          *ngFor="let message of messages"
          class="message-row"
          [ngClass]="{ 'user-message': message.sender === 'User', 'bot-message': message.sender === 'Bot' }"
        >
          <mat-card class="message-bubble">
            <div class="message-meta">{{ message.sender }} • {{ message.timestamp | date: 'shortTime' }}</div>
            <div class="message-content">{{ message.content }}</div>
          </mat-card>
        </div>
      </div>

      <div class="composer">
        <mat-form-field appearance="outline" class="composer-field">
          <mat-label>Message</mat-label>
          <input
            matInput
            [(ngModel)]="newMessage"
            placeholder="Type your message here..."
            (keyup.enter)="sendMessage()"
          />
        </mat-form-field>

        <button mat-icon-button color="primary" aria-label="Send message" (click)="sendMessage()">
          <mat-icon>send</mat-icon>
        </button>
      </div>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
